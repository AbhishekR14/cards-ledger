name: Test build APKs

# Builds the SMS edition and publishes it as the test-build prerelease, for trying changes on a
# phone before a release. It needs no secrets: build.ps1 generates a signing key for each run, so a
# preview build does not install over a release or over another preview. Releases are release.yml.

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'tests/**'
      - 'tools/**'
      - 'build.ps1'
      - '.github/workflows/test-build.yml'
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to publish the test APKs under
        default: test-build
        required: false

permissions:
  contents: write

concurrency:
  group: test-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Ensure Android platform and build tools
        run: |
          $ErrorActionPreference = 'Stop'
          $sdk = if ($env:ANDROID_SDK_ROOT) { $env:ANDROID_SDK_ROOT } else { $env:ANDROID_HOME }
          if (!$sdk) { throw 'Android SDK not found on the Windows runner.' }
          $manager = Get-ChildItem -LiteralPath "$sdk/cmdline-tools" -Filter 'sdkmanager.bat' -Recurse | Select-Object -First 1
          if (!$manager) { throw 'sdkmanager.bat is missing.' }
          & $manager.FullName 'platforms;android-35' 'build-tools;35.0.0'
          if ($LASTEXITCODE -ne 0) { throw 'Android SDK package installation failed.' }
          "ANDROID_SDK_ROOT=$sdk" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Build, test and verify the SMS edition
        run: |
          $ErrorActionPreference = 'Stop'
          ./build.ps1 -Edition sms
          $hash = (Get-FileHash -LiteralPath 'build/Cards-Ledger-SMS.apk' -Algorithm SHA256).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText((Join-Path $PWD 'build/SHA256SUMS.txt'),"$hash  Cards-Ledger-SMS.apk"+[Environment]::NewLine,[Text.UTF8Encoding]::new($false))
      - name: Publish the test APK
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = if ($env:TAG) { $env:TAG } else { 'test-build' }
          if ($tag -notmatch '^[A-Za-z0-9._-]{1,40}$') { throw 'Use a simple tag name.' }
          [xml]$manifest = Get-Content -LiteralPath 'app/src/main/AndroidManifest.xml' -Raw
          $version = $manifest.manifest.GetAttribute('versionName','http://schemas.android.com/apk/res/android')
          $short = $env:GITHUB_SHA.Substring(0,7)
          $lines = @(
            "Test build of Cards Ledger $version from $env:GITHUB_REF_NAME at $short.",
            '',
            'It records purchases from new incoming SMS. It asks for RECEIVE_SMS and nothing else: no notification access, no READ_SMS, no internet permission.',
            '',
            'If the download will not start, that is the browser rather than the link. Chrome blocks APK files with "This type of file can harm your device" - tap Download anyway. Release assets often fail to download inside the GitHub mobile app.',
            '',
            '**This is a test build, not a release.** Every run of this workflow signs with a newly generated key, so a later test build will not install over this one. Uninstall the previous test build first, exporting a backup from each card beforehand if you want to keep its ledger.',
            '',
            'Checksums are in SHA256SUMS.txt.'
          )
          [IO.File]::WriteAllText((Join-Path $PWD 'build/NOTES.md'),($lines -join [Environment]::NewLine),[Text.UTF8Encoding]::new($false))
          & gh release delete $tag --repo $env:GITHUB_REPOSITORY --yes --cleanup-tag 2>$null
          $global:LASTEXITCODE = 0
          & gh release create $tag 'build/Cards-Ledger-SMS.apk' 'build/SHA256SUMS.txt' `
            --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --prerelease `
            --title "Cards Ledger $version test build" --notes-file 'build/NOTES.md'
          if ($LASTEXITCODE -ne 0) { throw 'Publishing the test release failed.' }
      - name: Remove the generated signing key
        if: always()
        run: Remove-Item -LiteralPath '.signing/personal-release.p12','.signing/key-password.txt' -Force -ErrorAction SilentlyContinue
