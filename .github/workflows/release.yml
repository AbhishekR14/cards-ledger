name: Build and publish APK release

# Pushing a tag such as v1.0.0, or running this workflow from the Actions tab with a version,
# builds, verifies and publishes the SMS edition as a GitHub release. Run from the Actions tab, it
# creates the tag itself on the commit it built.
# With the ANDROID_KEYSTORE_BASE64 and ANDROID_KEYSTORE_PASSWORD secrets set, every release is
# signed with that retained key, so each one installs over the last. Without them the release is
# signed with a key generated for this run, and its notes say so. See docs/RELEASING.md.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, matching versionName in the manifest (for example 1.0.0)
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-2022
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Check the tag against the app version
        env:
          REQUESTED: ${{ inputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = if ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch') { 'v' + $env:REQUESTED.Trim().TrimStart('v') } else { $env:GITHUB_REF_NAME }
          if ($tag -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z.-]+)?$') { throw "Use a version such as 1.0.0 or 1.1.0-beta.1, not '$tag'." }
          [xml]$manifest = Get-Content -LiteralPath 'app/src/main/AndroidManifest.xml' -Raw
          $version = $manifest.manifest.GetAttribute('versionName','http://schemas.android.com/apk/res/android')
          $baseTag = ($tag.Substring(1) -split '-',2)[0]
          if ($version -ne $baseTag) { throw "Version $tag does not match the manifest's version $version." }
          "APP_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "RELEASE_TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Install the Android platform and build tools
        run: |
          $ErrorActionPreference = 'Stop'
          $sdk = if ($env:ANDROID_SDK_ROOT) { $env:ANDROID_SDK_ROOT } else { $env:ANDROID_HOME }
          if (!$sdk) { throw 'Android SDK not found on the runner.' }
          $manager = Get-ChildItem -LiteralPath "$sdk/cmdline-tools" -Filter 'sdkmanager.bat' -Recurse | Select-Object -First 1
          if (!$manager) { throw 'sdkmanager.bat is missing.' }
          & $manager.FullName 'platforms;android-35' 'build-tools;35.0.0'
          if ($LASTEXITCODE -ne 0) { throw 'Android SDK package installation failed.' }
          "ANDROID_SDK_ROOT=$sdk" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Prepare the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:KEYSTORE_BASE64 -and $env:KEYSTORE_PASSWORD) {
            New-Item -ItemType Directory -Force -Path '.signing' | Out-Null
            [IO.File]::WriteAllBytes((Join-Path $PWD '.signing/personal-release.p12'),[Convert]::FromBase64String($env:KEYSTORE_BASE64))
            [IO.File]::WriteAllText((Join-Path $PWD '.signing/key-password.txt'),$env:KEYSTORE_PASSWORD,[Text.UTF8Encoding]::new($false))
            'SIGNING=retained' | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          } else {
            Write-Warning 'No release key in the repository secrets: this release is signed with a key generated for this run.'
            'SIGNING=generated' | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          }
      - name: Build, test and verify the APK
        run: |
          $ErrorActionPreference = 'Stop'
          ./build.ps1 -Edition sms
          $apk = 'build/Cards-Ledger-SMS.apk'
          $certs = & "$env:JAVA_HOME/bin/java.exe" -jar "$env:ANDROID_SDK_ROOT/build-tools/35.0.0/lib/apksigner.jar" verify --print-certs $apk
          if ($LASTEXITCODE -ne 0) { throw 'APK signature verification failed.' }
          $match = [regex]::Match(($certs -join [Environment]::NewLine),'Signer #1 certificate SHA-256 digest:\s*([a-fA-F0-9]{64})')
          if (!$match.Success) { throw 'Could not read the signing certificate.' }
          "CERT_SHA256=$($match.Groups[1].Value.ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $hash = (Get-FileHash -LiteralPath $apk -Algorithm SHA256).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText((Join-Path $PWD 'build/SHA256SUMS.txt'),"$hash  Cards-Ledger-SMS.apk"+[Environment]::NewLine,[Text.UTF8Encoding]::new($false))
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $notes = [IO.File]::ReadAllText((Join-Path $PWD '.github/RELEASE_NOTES.md'))
          $lines = @('', '---', '', "Signing certificate SHA-256: ``$env:CERT_SHA256``")
          if ($env:SIGNING -eq 'generated') {
            $lines += ''
            $lines += 'This release is signed with a key generated for it. A later release signed with a different key will not install over it: back up from **Settings → Back up everything**, uninstall, install the new release and restore.'
          }
          [IO.File]::WriteAllText((Join-Path $PWD 'build/NOTES.md'),$notes+($lines -join [Environment]::NewLine)+[Environment]::NewLine,[Text.UTF8Encoding]::new($false))
          $releaseArgs = @('release','create',$env:RELEASE_TAG,'build/Cards-Ledger-SMS.apk','build/SHA256SUMS.txt','--repo',$env:GITHUB_REPOSITORY,'--title',"Cards Ledger $env:APP_VERSION",'--notes-file','build/NOTES.md')
          # A pushed tag must already exist; a run from the Actions tab creates it on the commit just built.
          if ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch') { $releaseArgs += @('--target',$env:GITHUB_SHA) } else { $releaseArgs += '--verify-tag' }
          if ($env:RELEASE_TAG.Contains('-')) { $releaseArgs += '--prerelease' } else { $releaseArgs += '--latest' }
          & gh @releaseArgs
          if ($LASTEXITCODE -ne 0) { throw 'Creating the GitHub release failed. Check whether this tag already has a release before retrying.' }
      - name: Remove signing files
        if: always()
        run: Remove-Item -LiteralPath '.signing/personal-release.p12','.signing/key-password.txt' -Force -ErrorAction SilentlyContinue
